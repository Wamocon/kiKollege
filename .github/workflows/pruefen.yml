# Prueft das Repository auf heikle Angaben, baut alle drei Fassungen bei jedem
# Push, prueft die oeffentliche darauf, dass nichts als intern Markiertes darin
# steht, und bei einem Pull Request
# zusaetzlich, dass der Bestand an Daten nicht kleiner geworden ist. Es wird
# nichts veroeffentlicht.
name: Prüfen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Das Repository ist oeffentlich: keine Adressen, Rechnernamen, Ports,
      # Schluessel oder fremden E-Mail-Adressen in Daten, Code und Doku.
      - name: Repository auf heikle Angaben prüfen
        run: npm run pruefe:daten
      - name: Skripte testen
        run: npm test
      - name: Interne Fassung bauen
        run: npm run build
      # Diese Fassung stellt Pages seit dem 17.09.2026.
      - name: Vollständige Fassung bauen
        run: npm run build
        env:
          FREIGABE: alles
      - name: Öffentliche Fassung bauen
        run: npm run build
        env:
          FREIGABE: oeffentlich
      - name: Öffentliche Fassung auf internen Inhalt prüfen
        run: npm run pruefe:oeffentlich
      # Ändern ist erlaubt, entfernen nicht: ein Pull Request darf keine Zahl,
      # keine Entscheidung und keinen offenen Punkt aus den Daten verlieren.
      - name: Bestand gegen den Zielzweig prüfen
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$BASIS"
          if git show "origin/$BASIS:data/projektstand.json" > /tmp/alt.json 2>/dev/null; then
            npm run pruefe:bestand -- --alt /tmp/alt.json
          else
            echo "Der Zielzweig führt die Datei noch nicht, nichts zu vergleichen."
          fi
        env:
          BASIS: ${{ github.base_ref }}
