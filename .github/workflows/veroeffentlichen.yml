# Stellt die oeffentliche Fassung auf GitHub Pages. Laeuft bei jedem Push auf
# main und zusaetzlich von Hand. Vor dem Hochladen wird geprueft, dass nichts
# als intern Markiertes im Ergebnis steht; schlaegt die Pruefung an, bricht der
# Lauf ab und es wird nichts veroeffentlicht.
#
# ACHTUNG: Pages ist bei einem privaten Repository ohne Enterprise-Tarif
# oeffentlich lesbar. Deshalb baut dieser Lauf ausdruecklich FREIGABE=oeffentlich
# und nie die interne Fassung.
name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  stellen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Skripte testen
        run: npm test
      - name: Öffentliche Fassung bauen
        run: npm run build
        env:
          FREIGABE: oeffentlich
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Auf internen Inhalt prüfen
        run: npm run pruefe:oeffentlich
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: pages
        uses: actions/deploy-pages@v4
