# Stellt die Seite auf GitHub Pages. Laeuft bei jedem Push auf main und
# zusaetzlich von Hand.
#
# Seit dem 17.09.2026 ist das die vollstaendige Fassung, FREIGABE=alles: Erwin
# Moretz hat entschieden, vorerst keinen Unterschied zwischen intern und
# oeffentlich zu machen, und das am 16.10.2026 bestaetigt. Pages ist bei
# diesem Tarif immer oeffentlich lesbar.
# Wer die Trennung zurueckwill, setzt FREIGABE wieder auf oeffentlich und nimmt
# den Pruefschritt unten wieder auf:
#
#   - name: Auf internen Inhalt pruefen
#     run: npm run pruefe:oeffentlich
name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  stellen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Skripte testen
        run: npm test
      - name: Vollständige Fassung bauen
        run: npm run build
        env:
          FREIGABE: alles
          BASE_PATH: /${{ github.event.repository.name }}
          # Fuer die Vorschau geteilter Links braucht die Seite ihre volle Adresse
          SEITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: pages
        uses: actions/deploy-pages@v5
