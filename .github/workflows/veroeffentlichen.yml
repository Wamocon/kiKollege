# Stellt die oeffentliche Fassung auf GitHub Pages. Laeuft nur von Hand, damit
# kein Push die Seite ungefragt nach aussen traegt. Vor dem Hochladen wird
# geprueft, dass nichts als intern Markiertes im Ergebnis steht; schlaegt die
# Pruefung an, bricht der Lauf ab.
name: Veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  stellen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Öffentliche Fassung bauen
        run: npm run build
        env:
          FREIGABE: oeffentlich
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Auf internen Inhalt prüfen
        run: npm run pruefe:oeffentlich
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: pages
        uses: actions/deploy-pages@v4
